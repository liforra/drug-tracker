# AGP tops out well below the newest JDKs, so build with 17. Which 17 is machine
# specific: set JAVA_HOME, or org.gradle.java.home in ~/.gradle/gradle.properties.
# (A hard-coded path here broke every machine but one, CI included.)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# The Kotlin compiler forks its own daemon; without a cap it sizes the heap from total
# RAM and gets OOM-killed on a machine that is already busy.
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=2
