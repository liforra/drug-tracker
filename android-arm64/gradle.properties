# AGP 8.13 tops out well below JDK 26, which is what /usr/bin/java is on this box.
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# The Kotlin compiler forks its own daemon; without a cap it sizes the heap from total
# RAM and gets OOM-killed on a machine that is already busy.
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=2
