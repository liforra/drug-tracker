[package]
name = "snus-tray"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "snus"
path = "src/main.rs"

[dependencies]
tracker-core = { path = "../core" }
ksni = "0.3"
# Already in the tree via ksni; used directly for desktop notifications rather than
# shelling out to notify-send, which would make libnotify a runtime requirement.
zbus = "5"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.32"
# Reines Rust, keine C-Abhaengigkeit; wir brauchen nur die Modulmatrix und
# rendern selbst -- einmal fuer das Terminal, einmal als Textur fuer egui.
qrcode = { version = "0.14", default-features = false }
directories = "6"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"
rand = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
