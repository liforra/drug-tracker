name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}

jobs:
  # Creates the release for this commit. The build jobs only depend on this, never on
  # each other, so each one uploads its artifact the moment it is done.
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Create release
        run: |
          gh release view "${{ steps.meta.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            || gh release create "${{ steps.meta.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "${{ steps.meta.outputs.tag }}" \
              --notes "Automated build of commit $GITHUB_SHA"

  server:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: server
      - run: cargo build --release -p tracker-server
      - name: Upload
        run: |
          cp target/release/tracker-server tracker-server-linux-x86_64
          gh release upload "${{ needs.release.outputs.tag }}" tracker-server-linux-x86_64 --clobber

  linux-client:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-client
      - run: cargo build --release -p snus-tray
      - name: Upload
        run: |
          cp target/release/snus snus-linux-x86_64
          gh release upload "${{ needs.release.outputs.tag }}" snus-linux-x86_64 --clobber

  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships an Android SDK; setup-android's own sdkmanager run failed
      # on it, so use the preinstalled one directly.
      - name: Install SDK components
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Build native library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./android-arm64/build-native.sh
      # Same debug key as on the phone, so release APKs install as updates over the
      # locally built one. Without the secret, Gradle generates a fresh key and the
      # APK will not upgrade an existing install.
      - name: Install signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "SNUS_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 not set; APK will be signed with a throwaway key"
          fi
      - name: Build APK
        working-directory: android-arm64
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload
        run: |
          cp android-arm64/app/build/outputs/apk/debug/app-debug.apk snus-tracker-android-arm64.apk
          gh release upload "${{ needs.release.outputs.tag }}" snus-tracker-android-arm64.apk --clobber
